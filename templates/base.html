{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}SmartHire{% endblock %}
    </title>

    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>

<body>

    <header class="navbar">

        <div class="container">

            <a href="{% url 'home' %}" class="logo">
            SmartHire
        </a>

            <nav>

                <a href="{% url 'home' %}">
                Home
            </a>

                <a href="#">
                Jobs
            </a>

                <a href="#">
                Companies
            </a> {% if user.is_authenticated %}

                <span class="welcome">
                    Hi, {{ user.username }}
                </span>

                <a href="#">
                    Dashboard
                </a>

                <a href="#">
                    Logout
                </a> {% else %}

                <a href="#">
                    Login
                </a>

                <a href="#">
                    Register
                </a> {% endif %}

            </nav>

        </div>

    </header>


    <main>

        {% block content %} {% endblock %}

    </main>


    <footer>

        <div class="container">

            <p>
                © 2026 SmartHire. All rights reserved.
            </p>

        </div>

    </footer>

</body>

</html>
